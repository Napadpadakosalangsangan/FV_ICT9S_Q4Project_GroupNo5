    <style>
        body{
            background: url("background.startwars.png") no-repeat center center/cover;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        
        }
        /* Top bar */
        .topbar {
            background: #111;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
        }

        .topbar h5 {
            margin: 0;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Section titles */
        .section-title {
            margin-top: 40px;
            margin-bottom: 15px;
            border-left: 5px solid #00c6ff;
            padding-left: 10px;
            font-weight: bold;
        }

        /* Notebook cards */
        .note-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
            border: 1px solid #444;
        }

        .note-card:hover {
            transform: translateY(-5px);
            border-color: #00c6ff;
        }

        .note-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .note-info {
            font-size: 0.85rem;
            color: #bbb;
        }

        .open-btn {
            margin-top: 10px;
            background: #00c6ff;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            padding: 5px 15px;
        }

        .open-btn:hover {
            background: #0099cc;
        }

        footer {
            text-align: center;
            padding: 10px;
            margin-top: 40px;
            background: #111;
            font-size: 13px;
        }
    </style>
