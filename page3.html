<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<head>

    <style>
        body {
            background: linear-gradient(to right, #1f1f1f, #2c2c2c);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* Top bar */
        .topbar {
            background: #111;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
        }

        .topbar h5 {
            margin: 0;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Section titles */
        .section-title {
            margin-top: 40px;
            margin-bottom: 15px;
            border-left: 5px solid #00c6ff;
            padding-left: 10px;
            font-weight: bold;
        }

        /* Notebook cards */
        .note-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
            border: 1px solid #444;
        }

        .note-card:hover {
            transform: translateY(-5px);
            border-color: #00c6ff;
        }

        .note-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .note-info {
            font-size: 0.85rem;
            color: #bbb;
        }

        .open-btn {
            margin-top: 10px;
            background: #00c6ff;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            padding: 5px 15px;
        }

        .open-btn:hover {
            background: #0099cc;
        }

        footer {
            text-align: center;
            padding: 10px;
            margin-top: 40px;
            background: #111;
            font-size: 13px;
        }

    .logo {
    width: 30px;
    height: 30px;
    object-fit: cover;
    border-radius: 50%; /* makes it circular */
}
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
     
    <div class="title-group">
        <img src="https://i.pinimg.com/736x/9c/19/33/9c1933b195422a9f382ed2922fd7f2b2.jpg" 
             alt="logo" class="logo">
        <span class="title-text">Mandelorian High</span>
    </div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#" onclick="subjects()">Subjects</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</div>

<div class="container">

    <h2 class="text-center mt-4">Home</h2>

    <div class="section-title">Profile</div>
    <div class="row g-3">
        <div>

    </div>
    </div>

 
    <div class="section-title">Major Subjects</div>
    <div class="row g-3">

    </div>
<div class="section-title">Assigned Activity</div>

<div class="row g-3">
    <div class="col-md-4">
        <div class="note-card">
            <div class="note-title">📘 Activity 1</div>
            <div class="note-info">Laboratory Worksheet</div>
            <button class="open-btn" onclick="openNote('Activity 1')">Open</button>
        </div>
    </div>

    <div class="col-md-4">
        <div class="note-card">
            <div class="note-title">📝 Activity 2</div>
            <div class="note-info">Submit ICT Project</div>
            <button class="open-btn" onclick="openNote('Activity 2')">Open</button>
        </div>
    </div>

    <div class="col-md-4">
        <div class="note-card">
            <div class="note-title">💻 Activity 3</div>
            <div class="note-info">ISubmit Math Quiz</div>
            <button class="open-btn" onclick="openNote('Activity 3')">Open</button>
        </div>
    </div>
</div>

    </div>
    </div>




</div>
<footer>
    Dustin Skiba T. Cunanan | 9-Sapphire ©2026
</footer>

<script>
    // Function to open Home
    function openNote(subject) {
        alert("📖 Opening " + subject + " notebook...");
    }

  function subjects(){
    window.location.href = "page2.html";

  }
    // Logout function
    function logout() {
        let confirmLogout = confirm("Are you sure you want to logout?");
        if (confirmLogout) {
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
