<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4 Skills Test 1</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1f2937, #0b0f19);
    color: white;
}


.login-card {
    width: 370px;
    padding: 32px;
    border-radius: 18px;

    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1);

    box-shadow: 0 10px 30px rgba(0, 198, 255, 0.08);
    text-align: center;
}


h2 {
    font-weight: 700;
    margin-bottom: 5px;
}


p {
    color: #b5b5b5;
    font-size: 14px;
}


.form-control {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    border-radius: 10px;
}

.form-control::placeholder {
    color: #aaa;
}

.form-control:focus {
    background: rgba(255,255,255,0.1);
    border-color: #00c6ff;
    box-shadow: 0 0 10px rgba(0,198,255,0.2);
    color: white;
}

/* Button */
.btn-custom {
    border-radius: 10px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    border: none;
    color: white;
    font-weight: 600;
    transition: 0.2s;
}

.btn-custom:hover {
    transform: scale(1.03);
    filter: brightness(1.1);
}

/* Password toggle */
.input-group .btn {

    color: white;
}

/* Instructions */
details summary {
    background: rgba(255,255,255,0.08);
    color: white;
    border-radius: 8px;
}

#instruct {
    font-size: 13px;
    color: #b5b5b5;
}

/* Link */
a {
    color: #00c6ff;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-card">
    <h2>Welcome Back</h2>
    <p>Login to continue</p>

    <details ontoggle="showInstructions()" class="mb-3">
        <summary class="btn btn-sm">Instructions</summary>
        <p id="instruct" class="mt-2"></p>

    </details>

    <input type="text" id="username" class="form-control mb-2" placeholder="Username">

    <div class="input-group mb-2">
        <input type="password" id="password" class="form-control" placeholder="Password">
        <button class="btn" onclick="togglePassword()">👁</button>
    </div>

    <button class="btn btn-custom w-100 mb-2" onclick="login()">Login</button>

    <p id="result"></p>

    <p>
        <a href="https://support.google.com/accounts/answer/41078?hl=en&co=GENIE.Platform%3DAndroid" target="_blank">
            Forgot password?
        </a>
    </p>
</div>

<script>
function showInstructions() {
    document.getElementById("instruct").innerHTML =
        "Enter your username and password to access your notebook system, For Sir Renn do User: Skibadoo, Pass: 2468";
}

function togglePassword() {
    let passField = document.getElementById("password");
    passField.type = passField.type === "password" ? "text" : "password";
}

let correctUser = "Skibadoo";
let correctPass = "2468";

function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "" || pass === "") {
        alert("⚠ Please fill in all fields.");
        return;
    }

    if (user === correctUser && pass === correctPass) {
        alert("✅ Login Successful!");
        window.location.href = "page2.html";
    } else {
        alert("❌ Wrong Username or Password.");
    }
}
</script>

</body>
</html>
