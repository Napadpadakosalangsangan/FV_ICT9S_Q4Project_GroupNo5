<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8">

  <title>Home Page</title>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<head>

    <style>
        body{
          background: linear-gradient(to right, #1f1f1f, #2c2c2c);
          font-family: 'Segoe UI', sans-serif;
          color: white;
        
        }

        .topbar{
          background: #111;
          padding: 15px 25px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 2px solid #444;
        }

        .topbar h5{
          margin: 0;
          font-weight: bold;
        }

        .nav-links a{
          color: white;
          margin-left: 15px;
          text-decoration: none;
          font-size: 14px;
        }

        .nav-links a:hover{
        text-decoration: underline;
        }

        .section-title{
          margin-top: 40px;
          margin-bottom: 15px;
          border-left: 5px solid #00c6ff;
          padding-left: 10px;
          font-weight: bold;
        }

        .note-card{
          background: #1a1a1a;
          border-radius: 12px;
          padding: 20px;
          transition: 0.3s;
          border: 1px solid #444;
        }

        .note-card:hover{
          transform: translateY(-5px);
          border-color: #00c6ff;
        }

        .note-title{
          font-size: 1.3rem;
          font-weight: bold;
        }

        .note-info{
          font-size: 0.85rem;
          color: #bbb;
        }

        .open-btn{
          margin-top: 5px;
          background: #00c6ff;
          border: none;
          color: black;
          font-weight: bold;
          border-radius: 8px;
          padding: 5px 15px;
        }

        .open-btn:hover{
          background: #0099cc;
        }
        
        .priority-box{
          width: 800px;
        }
        .priorities {
          background: #1a1a1a;
          color: #bbb;
          border-radius: 12px;
          padding: 20px;
          transition: 0.3s;
          border: 1px solid #444;
          width: 400px;
          margin: 0 auto;
        }
        
        .priorities:hover{
          background: #0a0f10;
        }
        

        footer{
          text-align: center;
          padding: 10px;
          margin-top: 40px;
          background: #111;
          font-size: 13px;
        }

        .logo{
          width: 30px;
          height: 30px;
          object-fit: cover;
          border-radius: 50%; 
        }

        .logo.profile{
          width: 100px;
          height: 100px;
          object-fit: cover;
          border-radius: 50%; 
        }

        .top-body{
          margin: 30px;
          width: 300px;
          height: 200px;
        }
          
        
    </style>
</head>
